---
- name: Créer le répertoire Jenkins Home sur l'hôte
  file:
    path: "{{ jenkins_home }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"

- name: Lancer le conteneur Jenkins
  community.docker.docker_container:
    name: "{{ jenkins_container_name }}"
    image: "{{ jenkins_image }}:{{ jenkins_tag }}"
    state: started
    restart_policy: unless-stopped
    ports:
      - "{{ jenkins_http_port }}:8080"
      - "{{ jenkins_agent_port }}:50000"
    volumes:
      - "{{ jenkins_home }}:/var/jenkins_home"
      - /var/run/docker.sock:/var/run/docker.sock
    env:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"

- name: Attendre que Jenkins soit disponible
  uri:
    url: "http://localhost:{{ jenkins_http_port }}/login"
    status_code: 200
  register: jenkins_status
  until: jenkins_status.status == 200
  retries: 30
  delay: 10

